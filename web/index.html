  background-size: 28px 28px;

#loading {
  position: fixed;
  inset: 0;
  z-index: 5;
  /* 紙で覆い、残す 500ms の間に 3D を透かさない（D-53） */
  background: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #3a4a6b;
  font-family: "Yomogi", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  font-size: 18px;
  font-weight: 500;
  line-height: 1.7;
  pointer-events: none;
  opacity: 0;
  animation: loading-in 1ms linear 300ms forwards;
}
#loading[hidden] { display: none; }
#loading.is-leaving { animation: loading-out 180ms cubic-bezier(0.23, 1, 0.32, 1) forwards; }
#loading p { margin: 0; }
/* 色は --color-pencil-line と鉛筆の部品の primitive。絵とキーフレームは scripts/gen-loading-art.mjs が作る */

.loading-art svg { display: block; }
.loading-art .pen path { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 2; stroke-dashoffset: 1; opacity: 0; }
.loading-art .pen .ghost { stroke-width: 1.1; stroke-opacity: 0.45; }
.loading-art .pen .dot { stroke-width: 2.6; }
/* 方眼の色の粒を lighten で線の上に重ねて、黒鉛のかすれにする。紙と方眼は変わらない。動かさないので描き直しの負荷にならない */
.loading-art .loading-grain { position: absolute; inset: 0; mix-blend-mode: lighten; will-change: transform; }
/* 鉛筆は1本ずつなぞらず、描いている部位のそばへ移り、そこで「かきかき、かきかき、ひと休み」と小さく動く（MOT-015） */
.loading-pencil {
  position: absolute;
  left: 0;
  top: 0;
  width: 96px;
  height: 96px;
  transform-origin: 70% 10%;
}
@keyframes pencil-scribble {
  0%, 60%, 100% { transform: translate(0, 0) rotate(0deg); }
  15%, 45% { transform: translate(-5px, 4px) rotate(-3deg); }
  30% { transform: translate(1px, -1px) rotate(1deg); }
  80% { transform: translate(2px, -4px) rotate(1.5deg); }
}
@keyframes loading-in { to { opacity: 1; } }
@keyframes loading-out { from { opacity: 1; } to { opacity: 0; } }
